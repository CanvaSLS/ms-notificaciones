# ms-notificaciones · bandeja de avisos · consumidor de TODOS los eventos
service: ms-notificaciones

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    SERVICE_NAME: ms-notificaciones
    T_NOTIFICACIONES: sp_notificaciones
    TOPIC_ARN: arn:aws:sns:${aws:region}:${aws:accountId}:sp-eventos-${sls:stage}

custom:
  auth:
    arn: arn:aws:lambda:${aws:region}:${aws:accountId}:function:ms-auth-${sls:stage}-autorizar
    type: token
    identitySource: method.request.header.Authorization
    resultTtlInSeconds: 0

package:
  patterns:
    - '!**'
    - '*.py'

functions:
  procesarNotificacion:
    handler: handler.procesar_notificacion
    events:
      - sqs:
          arn: { Fn::GetAtt: [ColaNotificaciones, Arn] }
          batchSize: 10
          maximumConcurrency: 2
          functionResponseType: ReportBatchItemFailures
  listarNotificaciones:
    handler: handler.listar_notificaciones
    events:
      - http: { path: notificaciones, method: get, cors: true, authorizer: "${self:custom.auth}" }
  marcarLeida:
    handler: handler.marcar_leida
    events:
      - http: { path: notificaciones/leida, method: post, cors: true, authorizer: "${self:custom.auth}" }
  marcarTodas:
    handler: handler.marcar_todas
    events:
      - http: { path: notificaciones/leida-todas, method: post, cors: true, authorizer: "${self:custom.auth}" }
  trazaEventos:
    handler: handler.traza_eventos
    events:
      - http: { path: notificaciones/traza, method: get, cors: true, authorizer: "${self:custom.auth}" }

resources:
  Resources:
    TNotificaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: sp_notificaciones
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: usuario_ts, AttributeType: S }
          - { AttributeName: creado_en, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: usuario_ts, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: gsi_tiempo
            KeySchema:
              - { AttributeName: tenant_id, KeyType: HASH }
              - { AttributeName: creado_en, KeyType: RANGE }
            Projection: { ProjectionType: ALL }

    ColaNotificaciones:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sp-notificaciones-${sls:stage}
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: { Fn::GetAtt: [ColaNotificacionesDLQ, Arn] }
          maxReceiveCount: 3
    ColaNotificacionesDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sp-notificaciones-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
    PoliticaColaNotificaciones:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [{ Ref: ColaNotificaciones }]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: { Fn::GetAtt: [ColaNotificaciones, Arn] }
              Condition:
                ArnEquals:
                  aws:SourceArn: ${self:provider.environment.TOPIC_ARN}
    SuscripcionNotificaciones:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${self:provider.environment.TOPIC_ARN}
        Protocol: sqs
        Endpoint: { Fn::GetAtt: [ColaNotificaciones, Arn] }
        FilterPolicyScope: MessageAttributes
        FilterPolicy:
          evento: [NotaPublicada, EntregaRegistrada, ModuloPublicado, AlumnoEnRiesgo, QuizCompletado]
    AlarmaDLQNotificaciones:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: sp-notificaciones-dlq-con-mensajes-${sls:stage}
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions: [{ Name: QueueName, Value: { Fn::GetAtt: [ColaNotificacionesDLQ, QueueName] } }]
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    GatewayResponse4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
    GatewayResponse5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
